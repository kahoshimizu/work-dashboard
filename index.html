<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作業レポートダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
h1{font-size:18px;font-weight:500}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font-size:12px;color:#999}
.tabs{display:flex;gap:4px;border-bottom:1px solid #ddd;margin-bottom:4px}
.tab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#1a1a1a;font-weight:500;border-bottom-color:#1a1a1a}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.summary-col{background:#fff;border-radius:10px;border:1px solid #eee;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.summary-col-title{font-size:11px;color:#aaa;font-weight:500;letter-spacing:.03em}
.summary-label{font-size:11px;color:#888;margin-bottom:2px}
.summary-value{font-size:18px;font-weight:500}
.section-title{font-size:15px;font-weight:500;margin:18px 0 8px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;background:#fff;border:1px solid #eee;border-radius:8px;padding:8px 12px}
.filter-bar label{display:flex;align-items:center;gap:4px;font-size:12px;color:#555;cursor:pointer;user-select:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:8px}
.box{background:#fff;border-radius:12px;padding:14px 18px;border:1px solid #eee}
.box-title{font-size:13px;font-weight:500;margin-bottom:10px;color:#444}
.bar-wrap{margin-bottom:4px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:13px;border-radius:8px;padding:3px 2px;transition:background .15s}
.bar-row.drop-target{background:rgba(84,195,241,.1);border:1px dashed #54C3F1}
.bar-label{width:86px;text-align:right;color:#666;flex-shrink:0;font-size:12px;padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#f0f0f0;border-radius:4px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-btn{border:none;background:transparent;cursor:pointer;font-size:11px;font-weight:500;color:#1a1a1a;padding:2px 5px;border-radius:4px;white-space:nowrap;min-width:80px;text-align:left}
.bar-btn:hover{background:#f0f0f0}
.item-list{margin:2px 0 6px 0}
.item-row{display:grid;grid-template-columns:64px 1fr 40px 16px;gap:6px;align-items:center;padding:3px 4px;border-radius:6px;font-size:11px;color:#555;cursor:grab}
.item-row:hover{background:#f5f5f5}
.item-row.dragging-item{opacity:.3}
.item-date{color:#999;font-size:10px}
.item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-dur{text-align:right;font-weight:500}
.drag-handle{color:#ccc;font-size:12px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:8px}
.loc-box{background:#fff;border-radius:12px;padding:14px 18px;border:1px solid #eee}
.loc-bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;cursor:pointer}
.loc-bar-label{width:64px;text-align:right;color:#666;flex-shrink:0}
.loc-bar-track{flex:1;background:#f0f0f0;border-radius:4px;height:14px;overflow:hidden}
.loc-bar-fill{height:100%;border-radius:4px}
.loc-bar-val{font-size:11px;color:#444;min-width:70px}
.loc-detail{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:8px 12px;margin:4px 0 8px 72px}
.loc-detail-dates{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.loc-date-chip{background:#fff;border:1px solid #ddd;border-radius:10px;padding:2px 8px;font-size:11px;color:#555}
.ai-box{background:#f9f9f9;border-radius:12px;padding:14px 18px;border:1px solid #eee;margin-top:14px}
.ai-title{font-size:14px;font-weight:500;margin-bottom:6px}
.ai-text{font-size:13px;color:#555;line-height:1.7}
.copy-hint{font-size:11px;color:#888;margin-top:6px}
.cal-picker{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.cal-box{background:#fff;border-radius:14px;padding:16px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month-label{font-size:14px;font-weight:500}
.cal-nav{background:none;border:none;font-size:18px;cursor:pointer;padding:2px 8px;border-radius:6px;color:#555}
.cal-nav:hover{background:#f0f0f0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;color:#aaa;text-align:center;padding:2px 0}
.cal-day{font-size:12px;text-align:center;padding:5px 2px;border-radius:6px;cursor:pointer;border:none;background:none;color:#1a1a1a}
.cal-day:hover:not(:disabled){background:#f0f0f0}
.cal-day.today{font-weight:700;color:#1a73e8}
.cal-day.selected{background:#1a73e8;color:#fff}
.cal-day.in-range{background:#e8f2fb}
.cal-day.faded{color:#ccc}
.cal-day.weekend{color:#e08}
.cal-day:disabled{color:#ddd;cursor:default}
.cal-close{margin-top:12px;width:100%;padding:7px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
.cal-close:hover{background:#f0f0f0}
/* 編集画面 — シンプル */
#edit-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#edit-modal.open{display:flex}
#edit-inner{background:#fff;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:86vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.edit-cat-block{margin-bottom:14px;border:1px solid #eee;border-radius:10px;overflow:hidden}
.edit-cat-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f9f9f9;border-bottom:1px solid #eee}
.edit-cat-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.edit-cat-name{font-size:13px;font-weight:500;flex:1}
.edit-words{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.edit-chip{display:inline-flex;align-items:center;gap:3px;background:#f0f0f0;border-radius:12px;padding:3px 8px;font-size:12px}
.edit-chip button{background:none;border:none;cursor:pointer;color:#aaa;font-size:13px;line-height:1;padding:0 0 0 2px}
.edit-chip button:hover{color:#c33}
.edit-add-row{display:flex;gap:6px;padding:0 14px 10px}
.edit-add-input{flex:1;border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:12px}
.edit-add-btn-s{border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:12px;background:#fff;cursor:pointer;white-space:nowrap}
.edit-add-btn-s:hover{background:#f0f0f0}
.color-swatch{display:inline-block;width:18px;height:18px;border-radius:4px;cursor:pointer;flex-shrink:0;margin:1px}
button{background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{background:#f5f5f5}
.loading{text-align:center;padding:48px;color:#888;font-size:14px}
.error{background:#fff0f0;border:1px solid #fcc;color:#c33;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.empty{font-size:13px;color:#aaa;text-align:center;padding:14px 0}
</style>
</head>
<body>

<!-- 編集モーダル（常にDOM上に存在） -->
<div id="edit-modal">
  <div id="edit-inner">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:16px;font-weight:500">カテゴリ編集</div>
      <button id="btn-close-edit" style="font-size:20px;border:none;background:none;cursor:pointer;color:#888;line-height:1;padding:4px 8px">×</button>
    </div>
    <div id="edit-body"></div>
    <div id="new-cat-section" style="margin:12px 0 8px;padding:14px;background:#f9f9f9;border-radius:10px;border:1px solid #eee">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px">新しいカテゴリを追加</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="new-cat-name" class="edit-add-input" style="flex:1;min-width:120px" placeholder="カテゴリ名">
        <input id="new-cat-color" type="color" value="#888780" style="width:36px;height:32px;border:1px solid #ddd;border-radius:6px;cursor:pointer;padding:2px">
        <button id="btn-add-cat" class="edit-add-btn-s">追加</button>
      </div>
    </div>
    <button id="btn-close-edit2" style="margin-top:8px;width:100%;padding:8px;font-size:13px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer">閉じる</button>
  </div>
</div>

<div id="app"><div class="loading">読み込み中…</div></div>

<script>
// ===== 定数 =====
const CLIENT_ID="729656531255-stonbhee0o8m10gfbqckf1bp2fump90g.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar.readonly";
const COLORS={"PJ":"#54C3F1","foobar*":"#F9C270","未分類":"#C1DB81","新卒 1on1":"#EF858C","UM 1on1":"#EF845C","PMP":"#796BAF","オムニチャネル":"#69BD83"};
const LOC_COLORS={"オフィス":"#6C9BD2","自宅":"#69BD83","その他":"#EF845C"};
const DAYS=["日","月","火","水","木","金","土"];
const PRESET_COLORS=["#54C3F1","#F9C270","#C1DB81","#EF858C","#EF845C","#796BAF","#6C9BD2","#69BD83","#EE87B4","#61C1BE","#BA79B1","#FFF67F","#888780","#3B6D11"];
const SK_WORDS="dashCatWords", SK_COLORS="dashCatColors";

const DEF_WORDS={
  "PJ":["JMB","タスク確認","JAL","SSNB","定例","リリース","Liquid","サーバ","Greens","GRS","Postmortem","TP","yumeno","SBJ","実行支援","GREENS","narumi","Narumi","Yumeno","議事録","[1466]","展開","売上","朱さん","障害","訪問","チケット","POS"],
  "foobar*":["foobar","foobar*","MM","DCC","KAITEKI","カクヤス","Monthly Mixer","CTOs Beer","Designer Creative Circle","イベント","Circle","ICHIYA","MKO","hubspot","IVS","アルムナイ","ノベルティ","MoMorph","小川","Kozue","figma","meet CTOs","SGG","ポスター"],
  "新卒 1on1":["Kaho / Miu","Kaho / Emiri","Emiri / Kaho","Miu / Kaho","Miu/Kaho","新卒"],
  "UM 1on1":["Masanori / Kaho","Satoshi / Kaho","[上期評価FB]"],
  "PMP":["[FY26]PMP1：Unit定例","General MTG for PMPs","Monthly Kickoff","PMP","新等級要件","OKR"],
  "オムニチャネル":["オムニチャネル","協会","オムニ"],
};
const DEF_COLORS={...COLORS};

// ===== カテゴリ設定（localStorage） =====
let CAT_WORDS=(()=>{try{const v=localStorage.getItem(SK_WORDS);return v?JSON.parse(v):JSON.parse(JSON.stringify(DEF_WORDS));}catch(e){return JSON.parse(JSON.stringify(DEF_WORDS));}})();
let CAT_COLORS=(()=>{try{const v=localStorage.getItem(SK_COLORS);return v?JSON.parse(v):{...DEF_COLORS};}catch(e){return {...DEF_COLORS};}})();

function saveCat(){
  try{localStorage.setItem(SK_WORDS,JSON.stringify(CAT_WORDS));localStorage.setItem(SK_COLORS,JSON.stringify(CAT_COLORS));}catch(e){}
}
function getCatColor(cat){return CAT_COLORS[cat]||COLORS[cat]||"#aaa";}
function getAllCats(){return [...Object.keys(CAT_WORDS).filter(c=>c!=="未分類"),"未分類"];}
function buildRules(){return Object.entries(CAT_WORDS).map(([cat,words])=>({m:t=>words.some(w=>t.includes(w)),c:cat}));}
function categorize(t){for(const r of buildRules())if(r.m(t))return r.c;return"未分類";}

// ===== 編集モーダル =====
function openEditScreen(){
  const body=document.getElementById("edit-body");
  body.innerHTML=Object.entries(CAT_WORDS).map(([cat,words],ci)=>{
    const chips=words.map((w,i)=>`<span class="edit-chip">${w}<button data-action="del-word" data-ci="${ci}" data-wi="${i}">×</button></span>`).join("")||'<span style="font-size:12px;color:#aaa">ワードなし</span>';
    const swatches=PRESET_COLORS.map((c)=>`<span class="color-swatch" data-action="set-color" data-ci="${ci}" data-color="${c}" style="background:${c};border:2px solid ${getCatColor(cat)===c?'#333':'transparent'}"></span>`).join("");
    const canDel=cat!=="未分類";
    return`<div class="edit-cat-block">
      <div class="edit-cat-header">
        <div class="edit-cat-dot" style="background:${getCatColor(cat)}"></div>
        <div class="edit-cat-name">${cat}</div>
        ${canDel?`<button data-action="del-cat" data-ci="${ci}" style="margin-left:auto;font-size:11px;color:#c33;border:1px solid #fcc;border-radius:6px;padding:2px 8px;background:#fff;cursor:pointer">カテゴリ削除</button>`:""}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px 4px;border-bottom:1px solid #f5f5f5">${swatches}</div>
      <div class="edit-words">${chips}</div>
      <div class="edit-add-row">
        <input class="edit-add-input" id="wi-${ci}" placeholder="ワードを追加…">
        <button class="edit-add-btn-s" data-action="add-word" data-ci="${ci}">追加</button>
      </div>
    </div>`;
  }).join("");
  document.getElementById("edit-modal").classList.add("open");
}

function closeEditScreen(){
  document.getElementById("edit-modal").classList.remove("open");
}

window.addEventListener("DOMContentLoaded",function(){
  const modal=document.getElementById("edit-modal");
  const inner=document.getElementById("edit-inner");
  modal.addEventListener("click",function(e){if(e.target===modal)closeEditScreen();});
  inner.addEventListener("click",function(e){e.stopPropagation();});
  document.getElementById("btn-close-edit").addEventListener("click",function(){closeEditScreen();});
  document.getElementById("btn-close-edit2").addEventListener("click",function(){closeEditScreen();});
  document.getElementById("btn-add-cat").addEventListener("click",function(){addCat();});
  document.getElementById("new-cat-name").addEventListener("keydown",function(e){if(e.key==="Enter")addCat();});
  document.getElementById("edit-body").addEventListener("click",function(e){
    const btn=e.target.closest("[data-action]");
    if(!btn)return;
    const cats=Object.keys(CAT_WORDS);
    const ci=parseInt(btn.dataset.ci);
    const cat=cats[ci];
    if(!cat)return;
    const action=btn.dataset.action;
    if(action==="del-word"){
      CAT_WORDS[cat].splice(parseInt(btn.dataset.wi),1);
      saveCat();recat();openEditScreen();
    }else if(action==="set-color"){
      CAT_COLORS[cat]=btn.dataset.color;
      saveCat();render();openEditScreen();
    }else if(action==="add-word"){
      const inp=document.getElementById("wi-"+ci);
      if(!inp)return;
      const w=inp.value.trim();if(!w)return;
      if(!CAT_WORDS[cat].includes(w))CAT_WORDS[cat].push(w);
      saveCat();recat();openEditScreen();
    }else if(action==="del-cat"){
      if(!confirm(`「${cat}」を削除しますか？`))return;
      delete CAT_WORDS[cat];delete CAT_COLORS[cat];
      saveCat();recat();openEditScreen();
    }
  });
});

function addCat(){
  const name=(document.getElementById("new-cat-name").value||"").trim();
  if(!name)return;
  if(CAT_WORDS[name]){alert("同名のカテゴリが既に存在します");return;}
  const color=document.getElementById("new-cat-color").value||"#888780";
  CAT_WORDS[name]=[];CAT_COLORS[name]=color;
  document.getElementById("new-cat-name").value="";
  saveCat();recat();openEditScreen();
}
function recat(){
  allEvItems.forEach(it=>{it.cat=categorize(it.title);});
  allTkItems.forEach(it=>{it.cat=categorize(it.title);});
  itemOverrides={ev:{},tk:{}};
  rebuildData();render();
}

// ===== Google API =====
let tokenClient=null,gapiLoaded=false,gisLoaded=false;
function tryReady(){
  if(!gapiLoaded||!gisLoaded)return;
  document.getElementById("app").innerHTML=`<div class="loading"><div style="font-size:15px;font-weight:500;margin-bottom:8px">作業レポートダッシュボード</div><div style="font-size:13px;color:#888;margin-bottom:20px">Googleアカウントでログインしてください</div><button id="btn-login" style="font-size:14px;padding:10px 28px;font-weight:500;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer">Googleでログイン</button></div>`;
  document.getElementById("btn-login").addEventListener("click",signIn);
}
function gapiInit(){gapi.load("client",async()=>{await gapi.client.load("https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest");gapiLoaded=true;tryReady();});}
function gisInit(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(r)=>{if(r.error){showError("認証エラー: "+r.error);return;}fetchData();}});gisLoaded=true;tryReady();}
function signIn(){if(!tokenClient)return;tokenClient.requestAccessToken({prompt:"consent"});}
function signOut(){try{const t=gapi.client.getToken();if(t)google.accounts.oauth2.revoke(t.access_token,()=>{});gapi.client.setToken(null);}catch(e){}document.getElementById("app").innerHTML=`<div class="loading"><div style="margin-bottom:12px">ログアウトしました</div><button id="btn-login2" style="font-size:14px;padding:10px 28px;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer">再ログイン</button></div>`;document.getElementById("btn-login2").addEventListener("click",signIn);}
function showError(msg){let el=document.getElementById("err");if(!el){el=document.createElement("div");el.id="err";el.className="error";document.getElementById("app").prepend(el);}el.textContent=msg;}

// ===== 状態 =====
let period="week",periodOffset=0,customStart=null,customEnd=null;
let calData=[],taskData=[],locData={},updatedAt="";
let openDetails={ev:{},tk:{},all:{}};
let filters={all:{},ev:{},tk:{}};
let itemOverrides={ev:{},tk:{}};
let locOpenDetail=null;
let allEvItems=[],allTkItems=[];
let dragItem=null;
let pickerMonth=new Date(),pickerState=null;

// ===== 日付ユーティリティ =====
function fmtH(h){return h<0.05?"0h":h.toFixed(1)+"h";}
function fmtDate(d){return`${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`;}
function fmtDateKey(s){return fmtDate(new Date(s));}
function isWE(ds){const d=new Date(ds);return d.getDay()===0||d.getDay()===6;}
function isExcluded(ev){return ev.colorId==="4"||ev.colorId==="8";}

function getRange(p){
  if(customStart&&customEnd){const s=new Date(customStart);s.setHours(0,0,0,0);const e=new Date(customEnd);e.setHours(23,59,59,999);return{start:s,end:e};}
  const now=new Date();
  const eb=new Date(now);
  if(p==="day")eb.setDate(eb.getDate()+periodOffset);
  else if(p==="week")eb.setDate(eb.getDate()+periodOffset*7);
  else eb.setDate(eb.getDate()+periodOffset*30);
  const e=new Date(eb);e.setHours(23,59,59,999);
  const s=new Date(eb);
  if(p==="day")s.setHours(0,0,0,0);
  else if(p==="week"){s.setDate(eb.getDate()-6);s.setHours(0,0,0,0);}
  else{s.setDate(eb.getDate()-29);s.setHours(0,0,0,0);}
  return{start:s,end:e};
}
function getPeriodLabel(p){const{start,end}=getRange(p);if(p==="day")return fmtDate(start);return`${fmtDate(start)}〜${fmtDate(end)}`;}

// ===== データ取得 =====
async function fetchData(){
  if(!gapiLoaded)return;
  try{
    const{start,end}=getRange(period);
    const res=await gapi.client.calendar.events.list({calendarId:"primary",timeMin:start.toISOString(),timeMax:end.toISOString(),singleEvents:true,orderBy:"startTime",maxResults:500});
    const items=res.result.items||[];
    let myEmail="";try{myEmail=(await gapi.client.calendar.calendarList.get({calendarId:"primary"})).result.id;}catch(e){}

    let locItems=[];
    try{const lr=await gapi.client.calendar.events.list({calendarId:"primary",timeMin:start.toISOString(),timeMax:end.toISOString(),singleEvents:true,maxResults:500,eventTypes:["workingLocation"]});locItems=lr.result.items||[];}
    catch(e){locItems=items.filter(ev=>ev.eventType==="workingLocation");}

    const locDays={オフィス:new Map(),自宅:new Map(),その他:new Map()};
    locItems.forEach(ev=>{
      const ds=ev.start?.date||ev.start?.dateTime?.slice(0,10);
      if(!ds||isWE(ds))return;
      const wl=ev.workingLocation;let loc=null;
      if(wl){if(wl.type==="homeOffice"||wl.homeOffice!=null)loc="自宅";else if(wl.type==="officeLocation"||wl.office!=null||wl.officeLocation!=null)loc="オフィス";else if(wl.type==="customLocation"||wl.customLocation!=null)loc="その他";}
      if(!loc){const t=(ev.summary||"").toLowerCase();if(/自宅|home|リモート|remote|wfh/.test(t))loc="自宅";else if(/オフィス|office|出社/.test(t))loc="オフィス";else loc="その他";}
      if(!locDays[loc].has(ds))locDays[loc].set(ds,fmtDate(new Date(ds)));
    });
    const tld=new Set([...locDays.オフィス.keys(),...locDays.自宅.keys(),...locDays.その他.keys()]).size||1;
    locData={オフィス:{days:locDays.オフィス.size,pct:Math.round(locDays.オフィス.size/tld*100),dates:[...locDays.オフィス.values()].sort()},自宅:{days:locDays.自宅.size,pct:Math.round(locDays.自宅.size/tld*100),dates:[...locDays.自宅.values()].sort()},その他:{days:locDays.その他.size,pct:Math.round(locDays.その他.size/tld*100),dates:[...locDays.その他.values()].sort()},total:tld};

    allEvItems=[];allTkItems=[];
    items.forEach(ev=>{
      if(isExcluded(ev))return;
      if(ev.eventType==="workingLocation"||ev.eventType==="outOfOffice")return;
      if(ev.start?.date&&!ev.start?.dateTime)return;
      if(!ev.start?.dateTime||!ev.end?.dateTime)return;
      const dur=(new Date(ev.end.dateTime)-new Date(ev.start.dateTime))/3600000;
      if(dur<=0)return;
      const title=ev.summary||"",desc=ev.description||"";
      const isTask=desc.includes("tasks.google.com/task/");
      if(!isTask&&(/^不在$/.test(title.trim())||/^移動$/.test(title.trim())))return;
      if(!isTask&&ev.attendees?.length>0){const me=ev.attendees.find(a=>a.self||(myEmail&&a.email===myEmail));if(me&&(me.responseStatus==="declined"||me.responseStatus==="tentative"||me.responseStatus==="needsAction"))return;}
      const item={title,dur,dateLabel:fmtDateKey(ev.start.dateTime),dateSort:ev.start.dateTime,cat:categorize(title)};
      if(isTask)allTkItems.push(item);else allEvItems.push(item);
    });
    itemOverrides={ev:{},tk:{}};openDetails={ev:{},tk:{},all:{}};
    rebuildData();
    const ac=getAllCats();["all","ev","tk"].forEach(k=>{ac.forEach(c=>{if(filters[k][c]===undefined)filters[k][c]=true;});});
    updatedAt=new Date().toLocaleTimeString("ja-JP");
    render();
  }catch(e){showError("エラー: "+(e.result?.error?.message||e.message||String(e)));}
}

function rebuildData(){
  function build(items,type){
    const map={};
    items.forEach((it,idx)=>{
      const cat=itemOverrides[type][idx]||it.cat;
      if(!map[cat])map[cat]={label:cat,value:0,count:0,items:[]};
      map[cat].value+=it.dur;map[cat].count++;map[cat].items.push({...it,globalIdx:idx,cat});
    });
    return Object.values(map).sort((a,b)=>b.value-a.value);
  }
  calData=build(allEvItems,"ev");taskData=build(allTkItems,"tk");
  const ac=getAllCats();["all","ev","tk"].forEach(k=>{ac.forEach(c=>{if(filters[k][c]===undefined)filters[k][c]=true;});});
}
function mergeData(a,b){const m={};[...a,...b].forEach(d=>{if(!m[d.label])m[d.label]={label:d.label,value:0,count:0,items:[]};m[d.label].value+=d.value;m[d.label].count+=d.count;m[d.label].items.push(...d.items);});return Object.values(m).sort((a,b)=>b.value-a.value);}
function filterData(data,sec){return data.filter(d=>filters[sec][d.label]!==false);}

// ===== インタラクション =====
function toggleDetail(type,idx){openDetails[type][idx]=!openDetails[type][idx];render();}
function toggleFilter(sec,cat){filters[sec][cat]=!filters[sec][cat];render();}
function toggleLocDetail(loc){locOpenDetail=locOpenDetail===loc?null:loc;render();}

// D&D
function onItemDragStart(e,type,gIdx,cat){
  dragItem={type,gIdx,cat};
  e.dataTransfer.effectAllowed="move";
  e.dataTransfer.setData("text/plain",cat);
  openDetails[type]={};openDetails.all={};
  rebuildData();render();
}
function onItemDragEnd(){dragItem=null;document.querySelectorAll(".bar-row").forEach(el=>el.classList.remove("drop-target"));}
function onBarDragOver(e,type,cat){e.preventDefault();if(!dragItem||dragItem.type!==type||dragItem.cat===cat)return;e.currentTarget.classList.add("drop-target");}
function onBarDragLeave(e){e.currentTarget.classList.remove("drop-target");}
function onBarDrop(e,type,newCat){e.preventDefault();e.currentTarget.classList.remove("drop-target");if(!dragItem||dragItem.type!==type||dragItem.cat===newCat)return;itemOverrides[type][dragItem.gIdx]=newCat;dragItem=null;openDetails={ev:{},tk:{},all:{}};rebuildData();render();}

// カレンダーピッカー
function openPicker(){const{start}=getRange(period);pickerMonth=new Date(start.getFullYear(),start.getMonth(),1);pickerState={step:"start",start:null};renderPicker();}
function closePicker(){const el=document.getElementById("cal-picker");if(el)el.remove();pickerState=null;}
function renderPicker(){
  const ex=document.getElementById("cal-picker");if(ex)ex.remove();
  const y=pickerMonth.getFullYear(),m=pickerMonth.getMonth();
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const off=fd===0?6:fd-1;
  let cells="";
  for(let i=0;i<off;i++)cells+=`<div class="cal-day faded"></div>`;
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d);const isFuture=dt>today;const isToday=dt.getTime()===today.getTime();
    const isSS=pickerState?.start&&dt.getTime()===new Date(pickerState.start).setHours(0,0,0,0);
    const isIR=pickerState?.start&&pickerState.step==="end"&&dt>=new Date(new Date(pickerState.start).setHours(0,0,0,0))&&dt<=today;
    const isWe=dt.getDay()===0||dt.getDay()===6;
    const cls=["cal-day",isFuture?"faded":"",isToday?"today":"",isSS?"selected":"",isIR?"in-range":"",isWe&&!isFuture?"weekend":""].filter(Boolean).join(" ");
    cells+=`<button class="${cls}" data-y="${y}" data-m="${m}" data-d="${d}" ${isFuture?"disabled":""}>${d}</button>`;
  }
  const sl=pickerState?.step==="start"?"開始日を選択":`終了日を選択（開始: ${fmtDate(pickerState.start)})`;
  const dows=["月","火","水","木","金","土","日"].map(d=>`<div class="cal-dow">${d}</div>`).join("");

  const wrap=document.createElement("div");
  wrap.className="cal-picker";wrap.id="cal-picker";
  wrap.innerHTML=`<div class="cal-box"><div style="font-size:12px;color:#888;text-align:center;margin-bottom:10px">${sl}</div><div class="cal-header"><button id="cal-prev" class="cal-nav">&#8249;</button><span class="cal-month-label">${y}年${m+1}月</span><button id="cal-next" class="cal-nav">&#8250;</button></div><div class="cal-grid">${dows}${cells}</div><button id="cal-cancel" class="cal-close">キャンセル</button></div>`;

  wrap.addEventListener("click",e=>{if(e.target===wrap)closePicker();});
  document.body.appendChild(wrap);

  document.getElementById("cal-prev").addEventListener("click",()=>{pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()-1,1);renderPicker();});
  document.getElementById("cal-next").addEventListener("click",()=>{pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()+1,1);renderPicker();});
  document.getElementById("cal-cancel").addEventListener("click",closePicker);

  wrap.querySelectorAll(".cal-day[data-d]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.disabled)return;
      pickDate(parseInt(btn.dataset.y),parseInt(btn.dataset.m),parseInt(btn.dataset.d));
    });
  });
}
function pickDate(y,m,d){
  const picked=new Date(y,m,d);const today=new Date();today.setHours(0,0,0,0);if(picked>today)return;
  if(pickerState.step==="start"){pickerState={step:"end",start:picked};renderPicker();}
  else{let s=pickerState.start,e=picked;if(s>e)[s,e]=[e,s];customStart=new Date(s);customEnd=new Date(e);periodOffset=0;closePicker();openDetails={ev:{},tk:{},all:{}};filters={all:{},ev:{},tk:{}};itemOverrides={ev:{},tk:{}};locOpenDetail=null;fetchData();}
}
function shiftPeriod(dir){const{end}=getRange(period);const now=new Date();now.setHours(23,59,59,999);if(dir===1&&end>=now)return;customStart=null;customEnd=null;periodOffset+=dir;openDetails={ev:{},tk:{},all:{}};filters={all:{},ev:{},tk:{}};itemOverrides={ev:{},tk:{}};locOpenDetail=null;fetchData();}
function changePeriod(p){period=p;periodOffset=0;customStart=null;customEnd=null;openDetails={ev:{},tk:{},all:{}};filters={all:{},ev:{},tk:{}};itemOverrides={ev:{},tk:{}};locOpenDetail=null;fetchData();}

// ===== 描画 =====
function filterBar(sec,allCats){return`<div class="filter-bar">${allCats.map(c=>`<label><input type="checkbox" ${filters[sec][c]!==false?"checked":""} onchange="toggleFilter('${sec}','${c}')">${c}</label>`).join("")}</div>`;}

function itemList(items,type){
  return`<div class="item-list">${items.slice().sort((a,b)=>a.dateSort<b.dateSort?-1:1).map(it=>`<div class="item-row" draggable="true" ondragstart="onItemDragStart(event,'${type}',${it.globalIdx},'${it.cat}')" ondragend="onItemDragEnd()"><span class="item-date">${it.dateLabel}</span><span class="item-title" title="${it.title}">${it.title}</span><span class="item-dur">${fmtH(it.dur)}</span><span class="drag-handle">⠿</span></div>`).join("")}</div>`;
}

function barChart(data,type){
  if(!data.length)return'<div class="empty">データなし</div>';
  const filtered=filterData(data,type);
  if(!filtered.length)return'<div class="empty">データなし</div>';
  const max=Math.max(...filtered.map(d=>d.value),0.1);
  return`<div style="font-size:10px;color:#bbb;text-align:right;margin-bottom:6px">アイテムを掴んで別カテゴリへドロップ</div>`+filtered.map((d,i)=>{
    const isOpen=openDetails[type]&&openDetails[type][i];
    return`<div class="bar-wrap"><div class="bar-row" ondragover="onBarDragOver(event,'${type}','${d.label}')" ondragleave="onBarDragLeave(event)" ondrop="onBarDrop(event,'${type}','${d.label}')"><div class="bar-label" title="${d.label}">${d.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max((d.value/max)*100,2).toFixed(1)}%;background:${getCatColor(d.label)}"></div></div><button class="bar-btn" onclick="toggleDetail('${type}',${i})">${fmtH(d.value)} (${d.count}) ${isOpen?"▲":"▼"}</button></div>${isOpen?itemList(d.items,type):""}</div>`;
  }).join("");
}

function pieChart(data){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return'<div class="empty">データなし</div>';
  let paths="";
  if(data.length===1){paths=`<circle cx="75" cy="75" r="65" fill="${getCatColor(data[0].label)}"/>`;}
  else{let cum=-Math.PI/2;paths=data.map(d=>{const a=(d.value/total)*2*Math.PI;const sx=cum;cum+=a;const r=65,cx=75,cy=75;const x1=cx+r*Math.cos(sx),y1=cy+r*Math.sin(sx);const x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);return`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r},0,${a>Math.PI?1:0},1,${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${getCatColor(d.label)}" stroke="#fff" stroke-width="1.5"/>`;}).join("");}
  const leg=data.map(d=>{const pct=Math.round(d.value/total*100);return`<div class="legend-item"><div class="legend-dot" style="background:${getCatColor(d.label)}"></div><span style="color:#666">${d.label}</span><span style="font-weight:500;margin-left:4px">${pct}%（${fmtH(d.value)}）</span></div>`;}).join("");
  return`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><svg viewBox="0 0 150 150" width="120" height="120" style="flex-shrink:0">${paths}</svg><div class="legend">${leg}</div></div>`;
}

function locPieChart(){
  const locs=["オフィス","自宅","その他"].filter(l=>(locData[l]||{days:0}).days>0);
  const total=locs.reduce((s,l)=>s+(locData[l]||{days:0}).days,0);
  if(!total)return'<div class="empty">データなし</div>';
  const data=locs.map(l=>({label:l,value:(locData[l]).days}));
  let paths="";
  if(data.length===1){paths=`<circle cx="75" cy="75" r="65" fill="${LOC_COLORS[data[0].label]}"/>`;}
  else{let cum=-Math.PI/2;paths=data.map(d=>{const a=(d.value/total)*2*Math.PI;const sx=cum;cum+=a;const r=65,cx=75,cy=75;const x1=cx+r*Math.cos(sx),y1=cy+r*Math.sin(sx);const x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);return`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r},0,${a>Math.PI?1:0},1,${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${LOC_COLORS[d.label]}" stroke="#fff" stroke-width="1.5"/>`;}).join("");}
  const leg=data.map(d=>{const pct=Math.round(d.value/total*100);return`<div class="legend-item"><div class="legend-dot" style="background:${LOC_COLORS[d.label]}"></div><span style="color:#666">${d.label}</span><span style="font-weight:500;margin-left:4px">${pct}%（${d.value}日）</span></div>`;}).join("");
  return`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><svg viewBox="0 0 150 150" width="120" height="120" style="flex-shrink:0">${paths}</svg><div class="legend">${leg}</div></div>`;
}

function locationSection(){
  const locs=["オフィス","自宅","その他"];
  const bars=locs.map(l=>{const d=locData[l]||{days:0,pct:0,dates:[]};const isOpen=locOpenDetail===l;const detail=isOpen&&d.dates.length?`<div class="loc-detail"><div class="loc-detail-dates">${d.dates.map(dt=>`<span class="loc-date-chip">${dt}</span>`).join("")}</div></div>`:"";return`<div><div class="loc-bar-row" onclick="toggleLocDetail('${l}')"><div class="loc-bar-label">${l}</div><div class="loc-bar-track"><div class="loc-bar-fill" style="width:${d.pct}%;background:${LOC_COLORS[l]}"></div></div><div class="loc-bar-val">${d.days}日 (${d.pct}%) ${isOpen?"▲":"▼"}</div></div>${detail}</div>`;}).join("");
  return`<div class="section-title">勤務場所</div><div class="loc-grid"><div class="loc-box"><div class="box-title">日数</div>${bars}</div><div class="loc-box"><div class="box-title">割合</div>${locPieChart()}</div></div>`;
}

function sectionHTML(title,data,type,allCats){
  const filtered=filterData(data,type);
  return`<div class="section-title">${title}</div>${filterBar(type,allCats)}<div class="grid"><div class="box"><div class="box-title">カテゴリ別時間</div>${barChart(data,type)}</div><div class="box"><div class="box-title">割合</div>${pieChart(filtered)}</div></div>`;
}

function copyShareLink(){
  navigator.clipboard.writeText(window.location.href.split("?")[0]).then(()=>{const b=document.getElementById("btn-share");if(b){b.textContent="コピーしました！";setTimeout(()=>{if(document.getElementById("btn-share"))document.getElementById("btn-share").textContent="🔗 リンクをコピー";},2000);}}).catch(()=>prompt("URLをコピーしてください",window.location.href));}

function copyForAI(){
  const labels={day:"1日",week:"直近1週間",month:"直近1ヶ月"};
  const ev=calData.map(d=>`${d.label}:${fmtH(d.value)}(${d.count}件)`).join(", ");
  const tk=taskData.map(d=>`${d.label}:${fmtH(d.value)}(${d.count}件)`).join(", ");
  const loc=["オフィス","自宅","その他"].map(l=>`${l}:${(locData[l]||{days:0}).days}日`).join(", ");
  const text=`${labels[period]}（${getPeriodLabel(period)}）の作業データです。\n予定: ${ev||"なし"}\nタスク: ${tk||"なし"}\n勤務場所: ${loc}\n\n上記データをもとに100〜150字で振り返りコメントをください。`;
  navigator.clipboard.writeText(text).then(()=>{const b=document.getElementById("btn-ai-copy");if(b){b.textContent="コピーしました！";setTimeout(()=>{if(document.getElementById("btn-ai-copy"))document.getElementById("btn-ai-copy").textContent="Claudeへのプロンプトをコピー";},2000);}});
}

function render(){
  const allData=mergeData(calData,taskData);
  const allCats=[...new Set([...getAllCats(),...allData.map(d=>d.label)])];
  ["all","ev","tk"].forEach(k=>{allCats.forEach(c=>{if(filters[k][c]===undefined)filters[k][c]=true;});});
  const tEv=calData.reduce((s,d)=>s+d.value,0),tTk=taskData.reduce((s,d)=>s+d.value,0);
  const cEv=calData.reduce((s,d)=>s+d.count,0),cTk=taskData.reduce((s,d)=>s+d.count,0);
  const tabs=["month","week","day"].map(t=>`<button class="tab${period===t?" active":""}" data-period="${t}">${{month:"1ヶ月",week:"1週間",day:"1日"}[t]}</button>`).join("");

    <div class="tabs">${tabs}</div>

      <button id="btn-next" style="padding:2px 10px;font-size:16px;opacity:${futDis?.3:1}" ${futDis?"disabled":""}>&#8250;</button>
    </div>
    <div class="summary-grid">
      <div class="summary-col"><div class="summary-col-title">合計</div><div><div class="summary-label">合計時間</div><div class="summary-value">${fmtH(tEv+tTk)}</div></div><div><div class="summary-label">合計件数</div><div class="summary-value">${cEv+cTk}件</div></div></div>
      <div class="summary-col"><div class="summary-col-title">予定</div><div><div class="summary-label">予定時間</div><div class="summary-value">${fmtH(tEv)}</div></div><div><div class="summary-label">予定件数</div><div class="summary-value">${cEv}件</div></div></div>
      <div class="summary-col"><div class="summary-col-title">タスク</div><div><div class="summary-label">タスク時間</div><div class="summary-value">${fmtH(tTk)}</div></div><div><div class="summary-label">タスク件数</div><div class="summary-value">${cTk}件</div></div></div>
    </div>
    <div class="section-title">合計</div>${filterBar("all",allCats)}
    <div class="grid"><div class="box"><div class="box-title">カテゴリ別時間</div>${allBar}</div><div class="box"><div class="box-title">割合</div>${pieChart(allFiltered)}</div></div>

  });
}

setInterval(()=>{try{if(gapiLoaded&&gapi.client.getToken())fetchData();}catch(e){}},300000);
